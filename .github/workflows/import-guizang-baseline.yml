name: Import verified Guizang baseline

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-guizang-baseline.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import byte-identical upstream files
        shell: bash
        run: |
          set -euo pipefail
          upstream="https://raw.githubusercontent.com/op7418/guizang-ppt-skill/c91369c449d34755d320a8b81d0734000d99d1ab"
          files=(
            LICENSE
            assets/motion.min.js
            assets/screenshot-backgrounds/style-a/dune.webp
            assets/screenshot-backgrounds/style-a/forest-ink.webp
            assets/screenshot-backgrounds/style-a/indigo-porcelain.webp
            assets/screenshot-backgrounds/style-a/kraft-paper.webp
            assets/screenshot-backgrounds/style-a/monocle-classic.webp
            assets/screenshot-backgrounds/style-b/ikb-dot-gradient.webp
            assets/screenshot-backgrounds/style-b/lemon-green-dot-shadow.webp
            assets/screenshot-backgrounds/style-b/lemon-grid.webp
            assets/screenshot-backgrounds/style-b/safety-orange-halftone.webp
            references/components.md
            references/image-prompts.md
            references/screenshot-framing.md
            references/swiss-map-component.md
            references/themes-swiss.md
            references/themes.md
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            curl --fail --location --silent --show-error "$upstream/$path" --output "$path"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "Import verified Guizang baseline assets"
            git push
          fi
