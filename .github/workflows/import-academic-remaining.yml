name: Import Academic PPT remaining files

on:
  push:
    paths:
      - .import/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and import local Academic PPT files
        shell: bash
        run: |
          set -euo pipefail
          cat .import/blob* | base64 --decode > /tmp/academic-remaining.tar.gz
          tar -xzf /tmp/academic-remaining.tar.gz
          rm -rf .import
          rm -f .github/workflows/import-guizang-baseline.yml
          rm -f .github/workflows/import-academic-remaining.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete academic-ppt skill"
          git push
